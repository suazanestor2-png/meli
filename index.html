<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para ti Meli</title>

    <style>

       
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            
            width: 100%;
            height: 100vh;

            /* Degradado suave y cálido, en movimiento lento */
            background: linear-gradient(120deg, #f8c8dc, #fbdce9, #f6cfe6, #fce3d8);
            background-size: 300% 300%;

            animation: moverDegradado 14s ease-in-out infinite;

            /* Centrar todo */
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            overflow: hidden;

            position: relative;
        }

        @keyframes moverDegradado {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }


        /* Capa de fondo con corazones/estrellas flotando lento */
        .fondo-flotante {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        .particula-fondo {

            position: absolute;

            bottom: -40px;

            opacity: 0;

            animation-name: subirFondo;
            animation-timing-function: ease-in;
            animation-iteration-count: infinite;
        }


        @keyframes subirFondo {

            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: var(--opacidad, 0.35);
            }

            90% {
                opacity: var(--opacidad, 0.35);
            }

            100% {
                transform: translateY(-115vh) translateX(var(--deriva, 0px)) rotate(var(--giro, 20deg));
                opacity: 0;
            }
        }


        /* El contenido va por encima del fondo animado */
        .contenido {

            position: relative;

            z-index: 1;
        }


        /* Botón para silenciar el sonido ambiente */
        .toggle-sonido {

            position: fixed;

            bottom: 22px;
            right: 22px;

            width: 46px;
            height: 46px;

            border-radius: 50%;

            border: 2px solid #e58aae;

            background-color: #fff7fa;

            font-size: 18px;

            cursor: pointer;

            box-shadow: 0 6px 14px rgba(170, 80, 120, 0.20);

            transition: all 0.3s ease;

            z-index: 10;
        }

        .toggle-sonido:hover {

            transform: scale(1.08);

            background-color: #ffe8f1;
        }


        
        .contenido {

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 25px;
        }


        
        .titulo {

            font-size: 38px;
            color: #5e3549;

            font-weight: bold;
        }


        
       #myButton {

    width: 260px;
    min-height: 90px;

    padding: 20px 30px;

    /* Forma ovalada */
    border-radius: 50px;

    border: 2px solid #e58aae;

    background-color: #fff7fa;

    color: #d94f87;

    font-size: 18px;
    font-weight: bold;

    text-align: center;
    line-height: 1.4;

    cursor: pointer;

    box-shadow: 0 8px 18px rgba(170, 80, 120, 0.20);

    transition: all 0.3s ease;
}

      #myButton:hover {

    transform: scale(1.07);

    background-color: #ffe8f1;

    /* Brillo rosado-rojo */
    box-shadow: 0 0 15px 4px rgba(255, 105, 150, 0.55),
                0 0 30px 10px rgba(255, 60, 90, 0.35),
                0 12px 25px rgba(170, 80, 120, 0.30);
}


       #myButton:active {

    transform: scale(0.97);
}   


        /* Texto rojo de abajo */
        .mensaje {

            color: red;

            font-size: 18px;

            font-weight: bold;
        }


        /* Corazones flotantes */
        .corazon {

            position: fixed;

            font-size: 24px;

            pointer-events: none;

            animation: flotar 3.4s ease-out forwards;

            z-index: 999;
        }

        @keyframes flotar {

            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translate(var(--dx), var(--dy)) rotate(var(--rot));
                opacity: 0;
            }
        }

    </style>

</head>


<body>


    <!-- CAPA DE FONDO ANIMADO -->
    <div class="fondo-flotante" id="fondoFlotante"></div>


    <!-- BOTÓN PARA SILENCIAR EL AMBIENTE -->
    <button id="toggleSonido" class="toggle-sonido" title="Silenciar/activar sonido ambiente">🔊</button>


    <div class="contenido">


        <!-- TEXTO DE ARRIBA -->

        <h1 class="titulo">
            Para ti Meli
        </h1>


        <!-- BOTÓN -->

        <button id="myButton">
            Hazme click para empezar esta aventura
        </button>


        <!-- TEXTO DE ABAJO -->

        <p class="mensaje">
            DEFDM
        </p>


    </div>



    <!-- JAVASCRIPT -->

    <script>

        /* Buscamos el botón por su ID */

        const boton = document.getElementById("myButton");


        /* =========================
           PARTÍCULAS DE FONDO (continuas y suaves)
        ========================== */

        const fondoFlotante = document.getElementById("fondoFlotante");
        const simbolosFondo = ["❤", "✨", "❤", "•"];
        const coloresFondo = ["#ff8fab", "#ffffff", "#e63950", "#ffd1e0"];

        function crearParticulaFondo() {

            const particula = document.createElement("span");
            particula.classList.add("particula-fondo");

            particula.innerHTML = simbolosFondo[Math.floor(Math.random() * simbolosFondo.length)];
            particula.style.color = coloresFondo[Math.floor(Math.random() * coloresFondo.length)];

            particula.style.left = Math.random() * 100 + "vw";

            const tamano = 12 + Math.random() * 20;
            particula.style.fontSize = tamano + "px";

            particula.style.setProperty("--opacidad", (0.2 + Math.random() * 0.3).toFixed(2));
            particula.style.setProperty("--deriva", (Math.random() * 160 - 80) + "px");
            particula.style.setProperty("--giro", (Math.random() * 90 - 45) + "deg");

            const duracion = 10 + Math.random() * 10;
            particula.style.animationDuration = duracion + "s";

            fondoFlotante.appendChild(particula);

            /* La quitamos cuando termina su recorrido para no acumular elementos */
            particula.addEventListener("animationiteration", function () {
                /* Le damos una nueva posición horizontal en cada vuelta, para variar */
                particula.style.left = Math.random() * 100 + "vw";
            });
        }

        /* Creamos un grupo inicial de partículas, todas en distintos puntos de su recorrido */
        for (let i = 0; i < 18; i++) {
            crearParticulaFondo();
            /* Les damos un delay negativo aleatorio para que no empiecen todas juntas desde abajo */
            const ultimaParticula = fondoFlotante.lastChild;
            ultimaParticula.style.animationDelay = "-" + (Math.random() * 12) + "s";
        }


        /* =========================
           CONTEXTO DE AUDIO (para ambiente, clic, etc.)
        ========================== */

        const contextoAudio = new (window.AudioContext || window.webkitAudioContext)();


        /* =========================
           SONIDO AMBIENTE DE FONDO (suave, tipo "pad")
        ========================== */

        const notasAmbiente = [130.81, 164.81, 196.00]; // acorde suave (C3, E3, G3)
        const nodosAmbiente = [];
        let ambienteIniciado = false;
        let sonidoActivo = true;

        function iniciarAmbiente() {

            if (ambienteIniciado) return;
            ambienteIniciado = true;

            const filtro = contextoAudio.createBiquadFilter();
            filtro.type = "lowpass";
            filtro.frequency.value = 500;
            filtro.connect(contextoAudio.destination);

            notasAmbiente.forEach(function (frecuencia) {

                const oscilador = contextoAudio.createOscillator();
                const ganancia = contextoAudio.createGain();

                oscilador.type = "sine";
                oscilador.frequency.value = frecuencia;

                /* Entra despacito, para que no se note un salto de volumen */
                ganancia.gain.setValueAtTime(0, contextoAudio.currentTime);
                ganancia.gain.linearRampToValueAtTime(0.025, contextoAudio.currentTime + 3);

                oscilador.connect(ganancia);
                ganancia.connect(filtro);

                oscilador.start();

                nodosAmbiente.push(ganancia);
            });

            /* LFO muy lento para que el filtro "respire" y no suene estático */
            const lfo = contextoAudio.createOscillator();
            const lfoGanancia = contextoAudio.createGain();

            lfo.frequency.value = 0.05;
            lfoGanancia.gain.value = 200;

            lfo.connect(lfoGanancia);
            lfoGanancia.connect(filtro.frequency);

            lfo.start();
        }

        function intentarIniciarAmbiente() {

            if (contextoAudio.state === "suspended") {
                contextoAudio.resume();
            }

            iniciarAmbiente();
        }

        /* Lo intentamos de una vez al cargar la página */
        intentarIniciarAmbiente();

        /* Si el navegador lo bloqueó, se activa con la primera interacción */
        ["click", "mousemove", "keydown", "touchstart"].forEach(function (evento) {
            document.addEventListener(evento, intentarIniciarAmbiente, { once: true });
        });


        /* Botón para silenciar/activar el ambiente */
        const toggleSonido = document.getElementById("toggleSonido");

        toggleSonido.addEventListener("click", function (evento) {

            evento.stopPropagation();

            sonidoActivo = !sonidoActivo;

            nodosAmbiente.forEach(function (ganancia) {
                ganancia.gain.setTargetAtTime(sonidoActivo ? 0.025 : 0, contextoAudio.currentTime, 0.4);
            });

            toggleSonido.textContent = sonidoActivo ? "🔊" : "🔈";
        });

        function sonarClick() {

            const ahora = contextoAudio.currentTime;

            /* Dos notas ascendentes, cálidas, tipo "campanita" al hacer clic */
            const notas = [
                { frecuencia: 660, inicio: 0 },
                { frecuencia: 990, inicio: 0.09 }
            ];

            notas.forEach(function (nota) {

                const oscilador = contextoAudio.createOscillator();
                const ganancia = contextoAudio.createGain();

                oscilador.type = "sine";
                oscilador.frequency.setValueAtTime(nota.frecuencia, ahora + nota.inicio);

                ganancia.gain.setValueAtTime(0, ahora + nota.inicio);
                ganancia.gain.linearRampToValueAtTime(0.22, ahora + nota.inicio + 0.015);
                ganancia.gain.exponentialRampToValueAtTime(0.0001, ahora + nota.inicio + 0.9);

                oscilador.connect(ganancia);
                ganancia.connect(contextoAudio.destination);

                oscilador.start(ahora + nota.inicio);
                oscilador.stop(ahora + nota.inicio + 0.9);
            });
        }

        /* Colores de los corazones: mitad rosados, mitad rojos */
        const coloresCorazon = ["#ff4d6d", "#e63950", "#ff8fab", "#d90429"];

        function crearCorazones() {

            const cantidad = 60;

            /* Posición del botón, para que los corazones nazcan desde ahí */
            const rect = boton.getBoundingClientRect();
            const centroX = rect.left + rect.width / 2;
            const centroY = rect.top + rect.height / 2;

            for (let i = 0; i < cantidad; i++) {

                const corazon = document.createElement("span");

                corazon.classList.add("corazon");
                corazon.innerHTML = "❤";

                /* Todos nacen desde el centro del botón, con algo de dispersión */
                const inicioX = centroX + (Math.random() * rect.width - rect.width / 2);
                const inicioY = centroY + (Math.random() * 20 - 10);

                corazon.style.left = inicioX + "px";
                corazon.style.top = inicioY + "px";

                /* Color: alterna entre rosado y rojo */
                corazon.style.color = coloresCorazon[i % coloresCorazon.length];

                /* Tamaño más grande */
                const tamano = 30 + Math.random() * 34;
                corazon.style.fontSize = tamano + "px";

                /* Ángulo y distancia aleatorios para que salgan en TODAS direcciones */
                const angulo = Math.random() * Math.PI * 2;
                const distancia = 250 + Math.random() * 350;

                corazon.style.setProperty("--dx", Math.cos(angulo) * distancia + "px");
                corazon.style.setProperty("--dy", Math.sin(angulo) * distancia + "px");
                corazon.style.setProperty("--rot", (Math.random() * 360 - 180) + "deg");

                /* Retraso aleatorio para que no salgan todos al mismo tiempo */
                corazon.style.animationDelay = (Math.random() * 0.5) + "s";

                document.body.appendChild(corazon);

                /* Lo quitamos del DOM cuando termina la animación */
                corazon.addEventListener("animationend", function () {
                    corazon.remove();
                });
            }
        }


        /* Esperamos que la persona haga clic */

        boton.addEventListener("click", function () {

            if (contextoAudio.state === "suspended") {
                contextoAudio.resume();
            }

            sonarClick();

            crearCorazones();

            /* Esperamos un poco para que se vean los corazones antes de cambiar de página */
            setTimeout(function () {
                window.location.href = "rosas_amarillas.html";
            }, 1400);


        });

    </script>


</body>

</html>
