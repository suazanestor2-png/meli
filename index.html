<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para ti Meli</title>

    <style>

       
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            
            width: 100%;
            height: 100vh;

            /* Fondo rosado pastel */
            background-color: #f8c8dc;

            /* Centrar todo */
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
        }


        
        .contenido {

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 25px;
        }


        
        .titulo {

            font-size: 38px;
            color: #5e3549;

            font-weight: bold;
        }


        
       #myButton {

    width: 260px;
    min-height: 90px;

    padding: 20px 30px;

    /* Forma ovalada */
    border-radius: 50px;

    border: 2px solid #e58aae;

    background-color: #fff7fa;

    color: #d94f87;

    font-size: 18px;
    font-weight: bold;

    text-align: center;
    line-height: 1.4;

    cursor: pointer;

    box-shadow: 0 8px 18px rgba(170, 80, 120, 0.20);

    transition: all 0.3s ease;
}

      #myButton:hover {

    transform: scale(1.07);

    background-color: #ffe8f1;

    box-shadow: 0 12px 25px rgba(170, 80, 120, 0.30);
}


       #myButton:active {

    transform: scale(0.97);
}


        /* Texto rojo de abajo */
        .mensaje {

            color: red;

            font-size: 18px;

            font-weight: bold;
        }

    </style>

</head>


<body>


    <div class="contenido">


        <!-- TEXTO DE ARRIBA -->

        <h1 class="titulo">
            Para ti Meli
        </h1>


        <!-- BOTÓN -->

        <button id="myButton">
            Hazme click para empezar esta aventura
        </button>


        <!-- TEXTO DE ABAJO -->

        <p class="mensaje">
            DEFDM
        </p>


    </div>



    <!-- JAVASCRIPT -->

    <script>

        /* Buscamos el botón por su ID */

        const boton = document.getElementById("myButton");


        /* Esperamos que la persona haga clic */

        boton.addEventListener("click", function () {


            /* Nos lleva a la página de las flores */

            window.location.href = "rosas_amarillas.html";


        });

    </script>


</body>

</html>
