<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #f8c8dc;
        }

        /* =====================================
           BOTONES DE NAVEGACIÓN
        ====================================== */

        .boton-siguiente,
        .boton-volver {
            position: fixed;
            top: 25px;
            z-index: 5000;
            text-decoration: none;
            background: #fff7fa;
            color: #d94f87;
            border: 2px solid #e58aae;
            padding: 15px 24px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 7px 18px rgba(150, 60, 100, 0.20);
            transition: 0.3s ease;
        }

        .boton-siguiente {
            right: 30px;
        }

        .boton-volver {
            left: 30px;
        }

        .boton-siguiente:hover,
        .boton-volver:hover {
            transform: scale(1.06);
            background: #ffe8f1;
            box-shadow: 0 12px 25px rgba(150, 60, 100, 0.30);
        }

        /* =====================================
           ESCENARIO
        ====================================== */

        .escenario {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #ramo {
            position: relative;
            width: 900px;
            height: 650px;
        }

        /* =====================================
           TALLOS
        ====================================== */

        .tallo {
            position: absolute;
            height: 8px;
            background: linear-gradient(#43b764, #1b7f3b);
            border-radius: 20px;
            transform-origin: left center;
            z-index: 1;
            transform: rotate(var(--a)) scaleX(0);
            animation: crecer .9s ease-out var(--d) forwards;
        }

        .tallo::after {
            content: "";
            position: absolute;
            width: 38px;
            height: 20px;
            left: 55%;
            top: -5px;
            background: linear-gradient(135deg, #55bd6f, #1f7d3c);
            border-radius: 100% 0 100% 0;
            transform: rotate(-35deg);
        }

        @keyframes crecer {
            to {
                transform: rotate(var(--a)) scaleX(1);
            }
        }

        /* =====================================
           PAPEL Y LAZO
        ====================================== */

        .papel {
            position: absolute;
            width: 320px;
            height: 205px;
            left: 290px;
            bottom: 0;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.82), rgba(255, 229, 240, 0.95));
            clip-path: polygon(0 0, 100% 0, 70% 100%, 30% 100%);
            z-index: 3;
        }

        .lazo {
            position: absolute;
            left: 50%;
            bottom: 83px;
            transform: translateX(-50%);
            width: 78px;
            height: 30px;
            background: #d94f87;
            border-radius: 50%;
            z-index: 25;
        }

        .lazo::before,
        .lazo::after {
            content: "";
            position: absolute;
            width: 60px;
            height: 45px;
            background: #e975a5;
            top: -8px;
        }

        .lazo::before {
            right: 58px;
            border-radius: 60% 10% 60% 10%;
            transform: rotate(-18deg);
        }

        .lazo::after {
            left: 58px;
            border-radius: 10% 60% 10% 60%;
            transform: rotate(18deg);
        }

        /* =====================================
           FLORES
        ====================================== */

        .flor {
            position: absolute;
            width: 112px;
            height: 112px;
            transform: translate(-50%, -50%);
            z-index: 20;
            transition: .28s;
        }

        .cabeza {
            position: absolute;
            width: 92px;
            height: 92px;
            left: 10px;
            top: 10px;
            opacity: 0;
            transform: scale(0);
            animation: florecer .72s ease-out var(--fd) forwards;
        }

        @keyframes florecer {
            0% {
                opacity: 0;
                transform: scale(0) rotate(-30deg);
            }

            70% {
                opacity: 1;
                transform: scale(1.16) rotate(5deg);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .petalo {
            position: absolute;
            width: 25px;
            height: 47px;
            left: 34px;
            top: 22px;
            background: linear-gradient(#fff45e, #ffc400 72%, #e7a900);
            border-radius: 55% 55% 45% 45%;
            transform-origin: 12px 24px;
        }

        .centro {
            position: absolute;
            width: 42px;
            height: 42px;
            left: 25px;
            top: 25px;
            border-radius: 50%;
            z-index: 5;
            background: radial-gradient(circle at 35% 35%, #8b4a17, #4e2608 55%, #251003);
        }

        /* =====================================
           FLORES ESPECIALES (más brillo)
        ====================================== */

        .especial {
            cursor: pointer;
            z-index: 40;
            animation: brillo 2.4s ease-in-out infinite;
        }

        @keyframes brillo {

            0%,
            100% {
                filter: drop-shadow(0 0 10px rgba(255, 211, 0, 0.75)) drop-shadow(0 0 4px rgba(255, 230, 100, 0.55));
            }

            50% {
                filter: drop-shadow(0 0 26px rgba(255, 226, 30, 1)) drop-shadow(0 0 12px rgba(255, 245, 160, 0.85));
            }
        }

        .especial:hover {
            transform: translate(-50%, -50%) scale(1.13);
            filter: drop-shadow(0 0 30px rgba(255, 221, 0, 1)) drop-shadow(0 0 14px rgba(255, 245, 170, 0.9));
            z-index: 2000;
        }

        .flor-centro {
            z-index: 80;
        }

        /* =====================================
           FRASES
        ====================================== */

        .frase {
            position: absolute;
            width: 300px;
            padding: 15px 18px;
            background: rgba(255, 250, 252, 0.98);
            border: 2px solid #e58aae;
            border-radius: 18px;
            color: #6f3149;
            font-size: 14px;
            line-height: 1.45;
            text-align: center;
            box-shadow: 0 11px 26px rgba(110, 40, 70, 0.22);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: .25s;
            z-index: 3000;

            /* Para que nunca se corte contra el borde de la pantalla */
            max-height: 85vh;
            overflow-y: auto;
        }

        .frase strong {
            display: block;
            margin-top: 8px;
            color: #d94f87;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .frase img {
            width: 100%;
            max-height: 120px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 10px;
            display: block;
        }

        /* Caja centrada en la pantalla para la flor que trae imagen */
        .frase.con-imagen {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            right: auto !important;
            bottom: auto !important;
            transform: translate(-50%, -50%) !important;

            width: 320px;
            max-height: 80vh;
        }

        .especial:hover .frase.con-imagen {
            transform: translate(-50%, -50%) !important;
        }

        .frase.con-imagen img {
            max-height: 170px;
        }

        .especial:hover .frase {
            opacity: 1;
            visibility: visible;
        }

        .frase.arriba {
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
        }

        .frase.abajo {
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
        }

        .frase.derecha {
            left: 120px;
            top: 50%;
            transform: translateY(-50%);
        }

        .frase.izquierda {
            right: 120px;
            top: 50%;
            transform: translateY(-50%);
        }

        .ayuda {
            position: fixed;
            left: 30px;
            bottom: 24px;
            color: #8d4863;
            font-size: 14px;
        }
    </style>

</head>

<body>

    <!-- BOTÓN PARA VOLVER -->
    <a href="index.html" class="boton-volver">
        ← ¿Quieres mirar el inicio otra vez?
    </a>

    <!-- BOTÓN PARA CONTINUAR -->
    <a href="canciones.html" class="boton-siguiente">
        Seguimos con esta pequeña aventura →
    </a>

    <!-- MÚSICA DE FONDO -->
    <!-- Coloca tu archivo de audio en la misma carpeta con este nombre, o cambia el nombre aquí -->
    <audio id="musica-fondo" src="Feid - CORONE (Instrumental) - WykzTV.mp3" loop></audio>

    <!-- ESCENARIO -->
    <div class="escenario">
        <div id="ramo">
            <div class="papel"></div>
            <div class="lazo"></div>
        </div>
    </div>

    <div class="ayuda">Pasa el mouse por las flores que brillan, pero deja la del centro para el final ✨</div>

    <script>
        const ramo = document.getElementById("ramo");
        const base = { x: 450, y: 565 };

        const flores = [
            { x: 450, y: 70, especial: true, posicion: "abajo", autor: "DUKI", frase: "Tal vez tú no te fuiste y yo tengo la suerte de hacer que me perdones, ¡antes de perderte!" },
            { x: 245, y: 125, especial: true, posicion: "derecha", autor: "DUKI", frase: "Por ti estoy aguantando los disparos, me peleo con tipos malos, bebo más en ocasiones, más cuando no estás al lado, ¡pero esto vale la pena!" },
            { x: 655, y: 125, especial: true, posicion: "izquierda", autor: "FEID", frase: "¿Cuántas veces nos hemos dejado? ¡Hasta por un mes nos hemos peleado!" },
            { x: 155, y: 275, especial: true, posicion: "derecha", autor: "FEID", frase: "Sé que soy un hpta pero ven, haría lo que fuera por ti, ¡por recuperarte otra vez!" },
            { x: 745, y: 275, especial: true, posicion: "izquierda", autor: "FEID", frase: "Tú conoces La Amenaza con rines en croma, mi baby se ve fina, nunca se ve putona." },
            { x: 255, y: 405, especial: true, posicion: "derecha", autor: "MORAT", frase: "Recuerdo por qué me enamoré, recuerdo lo que te enamoró, pero contestaste y ya se me olvidó ¡porque se acabó!" },
            { x: 645, y: 405, especial: true, posicion: "izquierda", autor: "ÁLVARO DÍAZ", frase: "No hay rockstar en cuentos de hadas, pero si estuviese ahí, no te faltaría nada." },
            { x: 450, y: 255, especial: true, centro: true, posicion: "abajo", autor: "DUKI", imagen: "imagen-central.jpeg", frase: "Tú alma tiene un pedazo de mí, es el que falta pa' hacerme feliz, así no voy a sobrevivir, esto no se puede sobrescribir, sabes lo que pienso sin tener que hablar." },
            { x: 340, y: 95 }, { x: 560, y: 95 }, { x: 335, y: 180 }, { x: 565, y: 180 }, { x: 245, y: 225 }, { x: 655, y: 225 },
            { x: 350, y: 300 }, { x: 550, y: 300 }, { x: 300, y: 355 }, { x: 600, y: 355 }, { x: 390, y: 390 }, { x: 390, y: 390 },
            { x: 510, y: 390 },

            /* FLORES EXTRA PARA HACER EL RAMO MÁS LLENO */
            { x: 190, y: 340 },
            { x: 710, y: 340 },
            { x: 285, y: 105 },
            { x: 615, y: 105 },
            { x: 285, y: 270 },
            { x: 615, y: 270 },
            { x: 220, y: 365 },
            { x: 680, y: 365 },
            { x: 335, y: 420 },
            { x: 565, y: 420 },
            { x: 410, y: 430 },
            { x: 490, y: 430 },
            { x: 405, y: 155 },
            { x: 495, y: 155 },
            { x: 395, y: 330 },
            { x: 505, y: 330 }
        ];

        function petalos(c) {
            for (let i = 0; i < 12; i++) {
                const p = document.createElement("div");
                p.className = "petalo";
                p.style.transform = `rotate(${i * 30}deg) translateY(-27px)`;
                c.appendChild(p);
            }
        }

        function crearFlor(f, i) {
            const dx = f.x - base.x, dy = f.y - base.y, l = Math.hypot(dx, dy), a = Math.atan2(dy, dx) * 180 / Math.PI;

            const t = document.createElement("div");
            t.className = "tallo";
            t.style.left = base.x + "px";
            t.style.top = base.y + "px";
            t.style.width = l + "px";
            t.style.setProperty("--a", a + "deg");
            t.style.setProperty("--d", i * .08 + "s");
            ramo.appendChild(t);

            const flor = document.createElement("div");
            flor.className = "flor " + (f.especial ? "especial" : "normal") + (f.centro ? " flor-centro" : "");
            flor.style.left = f.x + "px";
            flor.style.top = f.y + "px";

            const cab = document.createElement("div");
            cab.className = "cabeza";
            cab.style.setProperty("--fd", (i * .08 + .65) + "s");
            petalos(cab);

            const cen = document.createElement("div");
            cen.className = "centro";
            cab.appendChild(cen);
            flor.appendChild(cab);

            if (f.especial) {
                const tar = document.createElement("div");
                tar.className = "frase " + f.posicion + (f.imagen ? " con-imagen" : "");

                /* Si la flor tiene imagen (la del centro), la agregamos antes del texto */
                const imagenHTML = f.imagen ? `<img src="${f.imagen}" alt="Foto especial">` : "";

                tar.innerHTML = imagenHTML + f.frase + "<strong>" + f.autor + "</strong>";
                flor.appendChild(tar);
            }

            ramo.appendChild(flor);
        }

        flores.forEach(crearFlor);

        /* =====================================
           MÚSICA DE FONDO
        ====================================== */

        const musica = document.getElementById("musica-fondo");
        musica.volume = 0.5;

        /* Intentamos reproducir automáticamente */
        musica.play().catch(function () {
            /* Si el navegador bloquea el autoplay, la activamos con el primer clic */
            document.addEventListener("click", function activarMusica() {
                musica.play();
                document.removeEventListener("click", activarMusica);
            });
        });
    </script>

</body>

</html>
